# OpenPicasa · Cargo workspace (M1)
#
# M1 只建 4 个 crate（见 README「M1 的一个重要决策：减少 crate 数量」）。
# picasa-edit / picasa-face / picasa-ipc / picasa-cli 在 M1 **不存在** —— 这是红线 R-2 的结构性保证。

[workspace]
resolver = "3"
members = [
    "crates/picasa-db",
    "crates/picasa-imaging",
    "crates/picasa-core",
    "crates/picasa-ui",
]

[workspace.package]
version = "0.2.0-beta.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["OpenPicasa contributors"]
repository = "https://github.com/chongsenli/openpicasa"

[workspace.dependencies]
# ---- 数据 / 图像 ----
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "tiff",
    "bmp",
] }
kamadak-exif = "0.6"
# M2.2 PERF-13：JPEG 的 DCT 缩放解码。
# 选它的唯一理由：`Decoder::scale()` 原生支持 1/8 · 1/4 · 1/2 三档 DCT 缩放，
# 而这正是 §3.4 写的「目标边长 ≤ 原图/8 用 1/8 …」。依赖树里现成的 `zune-jpeg`
# （`image` 0.25 的 JPEG 后端）**没有**缩放 API，`turbojpeg`/`mozjpeg` 又要编 C。
jpeg-decoder = { version = "0.3", default-features = false, features = ["platform_independent"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rayon = "1.12"
notify = "8.2"
walkdir = "2.5"

# ---- 通用 ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Unicode NFC 归一：迁移时统一目录名编码（HFS+ 的 NFD ↔ APFS 的 NFC）。
# `picasa-core::paths::nfc` 是 M1 的手写近似版，只覆盖少量拉丁组合，迁移这种
# 「一次性改写全库」的场合必须用完整实现（`docs/05` §1.4.2）。
unicode-normalization = "0.1"

# ---- GUI（M1 的核心）----
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = [
    "wgpu",
    "persistence",
    "default_fonts",
    "system_fonts",
    # ---- Linux 后端（M1 只跑过 macOS，这里补齐；macOS 下这几个 feature 是空操作）----
    "x11",
    "wayland",
    "clipboard",
    "links",
] }
egui_extras = "0.37"

# ---- Linux 后端 shim ----
# eframe 的 wayland feature 走的是 egui-winit/wayland → winit/wayland，**不带 dlopen**，
# 于是 wayland-sys 的 build.rs 会用 pkg-config 去 probe libwayland-client 并静态链接。
# 在没装 pkg-config / 没有 libwayland-client.so 开发软链的机器上会直接构建失败。
# winit 的 default 里含 wayland-dlopen + wayland-csd-adwaita：
# 前者改为运行时 dlopen（不需要开发包），后者提供 Wayland 下的窗口边框。
# 这里只是为了让 cargo 把 winit 的 default feature 打开（feature 统一），代码里不直接用 winit。
winit = { version = "0.30", default-features = true }

# ---- macOS 专有（M1 新增）----
rfd = "0.17"

# ---- M1 显式不引入 ----
# rawler / rawloader      (LGPL-2.1, M2)
# tract-onnx / ort        (M2)
# little_exif / img-parts (M2，M1 不写元数据)
# resvg / usvg            (MPL-2.0, M1 用 egui 矢量绘制，见 02 §8.3)

# 注：virtual manifest 不能带 `[features]`（README 的骨架片段是示意）。
# M1 也没有任何 feature——ini 相关能力已随 crate 删除，没有需要开关的东西。

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"   # 控制 .app 体积（M1-P11 ≤ 30MB）

# 图像处理是计算密集型，debug 下也要跑得动
[profile.dev.package."*"]
opt-level = 2

# ⚠️ 上面那条**不覆盖本工作区的成员 crate**，而 `imageops::resize` 是泛型函数，
# 会以**调用方 crate 的 opt-level** 在调用方里实例化——picasa-imaging 停在 O0 时，
# 一次 155 万像素 → 512 的重采样要 800 ms（实测占单张缩略图耗时的 95%，
# 而真正的解码只有 40 ms）。25.9 万张的库按这个速度要 58 小时，
# 用户看到的现象就是「缩略图永远补不完」。
# 这里只把像素热路径这个 crate 抬到 O3，其余仍是 O0（保留快速编译与完整调试信息）。
[profile.dev.package.picasa-imaging]
opt-level = 3
