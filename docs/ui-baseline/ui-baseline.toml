# OpenPicasa UI 基线值（M2.2）
#
# 来源：`picasa-refs/09-library-zh-full.png`（1312×768，**原生分辨率**，无缩放）。
# 量法：PIL 逐像素采样，2026-11-01，由工程侧按 PM 授权（「给你了，开始干」）量取。
# 规则：
#   - 每个值都注明出处（像素坐标 / 采样方法）；
#   - **参考图里量不出的项不编数**，列在文末「本图不可测」清单，沿用现值待并排评审；
#   - 改这里必须同步改 `crates/picasa-ui/src/theme.rs`（反之亦然），注释里互相指向。

# ---------------------------------------------------------------- 树（§2.2）
[tree]
# 相邻文件夹图标行的顶距，y=169→191→213→235… 恒为 22px
row_height = 22
# 图标箱体：x[31..45] w=15，y[213..224] h=12（行内垂直居中）
icon_w = 15
icon_h = 12
# 图标右沿 x=45，文字左沿 x≈50
icon_text_gap = 5
# 所有可见文件夹都在同一层级 → 量不出；沿用现值 14
# indent_step = <本图不可测>

# 选中行：y=165..186（22px），纯色无渐变；上沿 1px (155,155,155) 是上一行组头的下边框
selected_bg = "#83A7BD"        # (131,167,189)
selected_text = "#FFFFFF"
# ⚠️ 悬停态：参考图没有悬停中的行，量不出 → 沿用 cell_hover #DCE6F2

# 计数「(1)」与标签**同色**（最深像素都是 (77,77,77)），只是字号小一号
text = "#4D4D4D"               # 标签与计数共用
count_suffix = "()"            # Picasa 的计数带括号

# ------------------------------------------------------------ 组头（§2.2）
[tree.header]
# 「人物 (1)」「资料夹 (29)」：一个带边框的白盒，不是纯文字
# y=82..102 / 144..164，高 21px（实现取 22 对齐行高）
height = 21
# 竖直渐变：顶 (241,243,246) → 底 (220,221,225)
bg_top = "#F1F3F6"
bg_bottom = "#DCDDE1"
border = "#9B9B9B"             # 四周 1px
text = "#4D4D4D"               # 粗体
# 左端折叠钮：Picasa 绿
disclosure_green = "#0A9000"   # (10,144,0)，内嵌白色三角

# ------------------------------------------------------------ 图标（§2.1）
[icons.folder]
# 拟物文件夹（树内 15×12 版）。逐行平均色：
#   y217 #EBCD9A → y220 #D8B780 → y223 #C29F68（前面板渐变）
front_top = "#F9DCA1"
front_mid = "#EBCD9A"
front_bottom = "#C29F68"
outline = "#A67C59"            # 图标区域内最深像素（描边）
# 后盖（标签耳）比前面板深一档；实现取 #C29B5E（由描边/前面板插值，无独立采样区）

# ------------------------------------------------------------ 栅格（§2.3/§2.4）
[grid]
# 栅格背景：大面积采样 (600,300)/(900,200) = (242,242,242)
bg = "#F2F2F2"
# 图像间**最小可见**间隙 15px（y=430 横版照片行）。
# ⚠️ Picasa 是固定 cell + 图像居中，图像不充满 cell，所以 cell_gap 无法直接量：
#    15px = cell_gap + 2×cell 内边距。实现暂保持 cell_gap=10，待并排评审。
# cell_gap = <本图不可测（只能得可见间隙 ≥15px）>
# ⚠️ selected_border / hover_border：参考图里没有选中/悬停中的缩略图 → 量不出
# ⚠️ 占位格灰 / 组头三值：本图栅格无「待生成」占位、无日期组头 → 量不出

# ------------------------------------------------------------ 组头（栅格内）
[grid.group_header]
# 大文件夹图标 ≈ 40×30（x≈285..325, y≈68..98，含投影）；名称为衬线体（Serif）
# 名称字号（按字高估）≈ 20px；日期 ≈ 12px、颜色更深灰
# ⚠️ 精确字号/颜色受抗锯齿影响，此处为估值，待并排评审

# ------------------------------------------------------------ 顶部两段（§2.5）
# ⚠️ 2026-11-01 更正：之前把「菜单栏」当成了「工具栏」。逐行扫描 x=650 后确认
#    顶部实际是**三段**，我们只画后两段（标题栏是 OS 的）：
#       y=0..19   标题栏 #ADADAD（OS 绘制，我们不画）
#       y=20..40  菜单栏 21px，渐变 #FEFEFF(y22) → #D4DBEE(y30) → #E1E6F6(y39)，底边 #B6BCCC
#       y=41..79  工具行 38px，底色 #E8E8E8，底边 #BABABA
#       y=80..    内容区
#    PM 已拍板照抄（2026-11-01），旧版「68px 图标在上文案在下」废弃。
[menubar]
height = 21
bg_top = "#FEFEFF"
bg_mid = "#D4DBEE"
bg_bottom = "#E1E6F6"
border_bottom = "#B6BCCC"

[toolrow]
height = 38
bg = "#E8E8E8"
border_bottom = "#BABABA"
# 搜索框：x=1250 处 y=49..72，#7F9DB9 蓝灰边 + 白芯（XP 经典风格），高 23px
search_border = "#7F9DB9"
search_height = 23

# ---------------------------------------------------------------- 状态栏
# 参考图底部有进度条 + 缩放滑块 + 分享按钮区，与我们的 U-33 版式不同，
# 本轮未逐项量取（避免半成品对照）。待 PM 确认状态栏版式后再量。

# ================================================================ 本图不可测清单
# 以下项在 09-library-zh-full.png 中没有可采样的实例，**不编数**：
#   - tree.indent_step（所有可见文件夹同层级）
#   - tree.hover（无悬停中的行）
#   - grid.cell_gap 的精确值（图像居中导致只能得可见间隙下限 15px）
#   - grid.selected_border_* / grid.hover_border_*（无选中/悬停缩略图）
#   - grid 占位格灰、grid 组头三值（本图无占位格、栅格按平铺无日期组头显示）
#   - 工具行按钮的精确位置/尺寸/间距（本图按钮是图标+下箭头的组合控件，与我们的功能集不同）
#   - 菜单栏各菜单的展开内容（本图只显示折叠态标题）
#   - 状态栏各行值（版式不同）
#
# ⚠️ 版式照抄 ≠ 照抄功能：参考图菜单有「编辑(E)」「建立(C)」，属 R-2 红线禁止的
#    编辑入口（M1 U-12 判据「无编辑入口」），本轮**不放**这两个菜单。
